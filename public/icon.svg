<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 색은 Stripe DESIGN.md 값. canvas #ffffff / canvas-soft #f6f9fc /
       hairline #e3e8ee / primary #533afd. public/icons/*.png도 같은 도형이다
       (생성기: scratchpad/make-icons.cjs). 도형을 고치면 PNG도 다시 만들어야 한다. -->
  <rect width="512" height="512" fill="#ffffff"/>
  <circle cx="256" cy="256" r="210" fill="#f6f9fc" stroke="#e3e8ee" stroke-width="3"/>
  <g fill="#533afd">
    <!-- 왼쪽 원판 -->
    <rect x="130" y="196" width="22" height="120" rx="4"/>
    <rect x="160" y="216" width="14" height="80" rx="3"/>

    <!-- 오른쪽 원판 -->
    <rect x="360" y="196" width="22" height="120" rx="4"/>
    <rect x="338" y="216" width="14" height="80" rx="3"/>

    <!-- 중앙 바 -->
    <rect x="174" y="248" width="164" height="16" rx="3"/>
  </g>
</svg>
