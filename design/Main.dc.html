<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap');

  .app * { box-sizing: border-box; margin: 0; padding: 0; }
  .app {
    width: 390px; height: 844px;
    background: #ffffff; color: #111111;
    font-family: 'Helvetica Neue', Helvetica, Arial, 'Malgun Gothic', sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .disp {
    font-family: 'Jost', 'Century Gothic', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600; letter-spacing: -0.01em;
  }

  .bar { height: 3px; background: #f5f5f5; flex: none; }
  .bar i { display: block; height: 100%; width: 28%; background: #111111; }
  .head {
    flex: none; height: 56px; padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid #e5e5e5;
  }
  .back { font-size: 20px; line-height: 1; }
  .head .t { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .head .c { margin-left: auto; font-size: 12px; color: #707072; font-variant-numeric: tabular-nums; }

  .body { flex: 1; padding: 26px 20px 0; overflow: hidden; }
  .exname { font-size: 30px; line-height: 1.06; letter-spacing: -0.02em; }
  .exmeta { margin-top: 9px; font-size: 12px; color: #707072; letter-spacing: 0.02em; }

  .tbl { margin-top: 26px; }
  .th, .tr {
    display: grid; grid-template-columns: 30px 1fr 62px 48px 46px 30px;
    align-items: center; gap: 4px;
  }
  .th {
    font-size: 10px; letter-spacing: 0.1em; color: #9e9ea0;
    text-transform: uppercase; padding: 0 12px 9px;
  }
  .th span:nth-child(n+3) { text-align: center; }
  .tr {
    height: 52px; padding: 0 12px; border-radius: 18px;
    font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .tr span:nth-child(n+3) { text-align: center; }
  .tr .n { font-size: 13px; color: #9e9ea0; }
  .tr .prev { font-size: 12px; color: #9e9ea0; }
  .tr.now { background: #111111; color: #ffffff; }
  .tr.now .n, .tr.now .prev { color: #ffffff; opacity: 0.5; }
  .tr.now .tick { color: #ffffff; opacity: 0.45; }
  .tr.next { color: #cacacb; }
  .tr.next .n, .tr.next .prev { color: #cacacb; }

  .gauge { margin-top: 28px; }
  .glabel {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 11px;
  }
  .glabel b { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .glabel em {
    font-style: normal; font-size: 11px; color: #9e9ea0;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .track {
    position: relative; height: 46px; border-radius: 9999px;
    background: #f5f5f5; overflow: hidden;
  }
  .zone { position: absolute; top: 0; bottom: 0; background: #111111; border-radius: 9999px; }
  .stops { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
  .stops span {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-variant-numeric: tabular-nums; color: #9e9ea0;
  }
  .stops span.in { color: #ffffff; }
  .stops span.aim { color: #ffffff; font-weight: 600; font-size: 17px; }
  .ends {
    display: flex; justify-content: space-between; margin-top: 9px;
    font-size: 10px; letter-spacing: 0.1em; color: #9e9ea0; text-transform: uppercase;
  }

  .why {
    margin-top: 22px; padding-top: 16px; border-top: 1px solid #e5e5e5;
    font-size: 12px; line-height: 1.6; color: #707072;
  }
  .why b { color: #111111; font-weight: 600; }

  .foot {
    flex: none; padding: 14px 20px 26px;
    display: flex; align-items: center; gap: 12px;
    border-top: 1px solid #e5e5e5;
  }
  .timer {
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 20px; border-radius: 9999px;
    background: #f5f5f5; font-size: 17px; font-variant-numeric: tabular-nums;
  }
  .timer i { font-style: normal; font-size: 12px; color: #707072; }
  .cta {
    flex: 1; height: 52px; border-radius: 9999px;
    background: #111111; color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
  }
</style>

<div class="app">
  <div class="bar"><i></i></div>

  <div class="head">
    <span class="back">&#8592;</span>
    <span class="t">PULL A</span>
    <span class="c">4 / 14 세트</span>
  </div>

  <div class="body">
    <div class="exname disp">랫 풀다운</div>
    <div class="exmeta">보조 운동 · 3세트 · 8–12회 · 휴식 2:30</div>

    <div class="tbl">
      <div class="th">
        <span>#</span><span>이전</span><span>KG</span><span>회</span><span>RIR</span><span></span>
      </div>
      <div class="tr now">
        <span class="n">1</span><span class="prev">50 × 12</span>
        <span>52.5</span><span>8</span><span>2</span><span class="tick">&#9711;</span>
      </div>
      <div class="tr next">
        <span class="n">2</span><span class="prev">50 × 12</span>
        <span>52.5</span><span>8</span><span>1</span><span></span>
      </div>
      <div class="tr next">
        <span class="n">3</span><span class="prev">50 × 12</span>
        <span>52.5</span><span>8</span><span>0</span><span></span>
      </div>
    </div>

    <div class="gauge">
      <div class="glabel">
        <b>2개 남기고 멈춘다</b>
        <em>1세트 목표</em>
      </div>
      <div class="track">
        <div class="zone" style="left:20%; width:60%;"></div>
        <div class="stops">
          <span>0</span><span class="in">1</span><span class="aim">2</span><span class="in">3</span><span>4+</span>
        </div>
      </div>
      <div class="ends"><span>한계</span><span>여유</span></div>
    </div>

    <div class="why">
      지난주 50kg으로 세 세트 모두 <b>12회</b> — 범위 상단이라 <b>2.5kg</b> 올렸어.
      세트가 갈수록 목표는 <b>2 → 1 → 0</b>으로 좁아진다.
    </div>
  </div>

  <div class="foot">
    <div class="timer"><i>휴식</i>1:19</div>
    <div class="cta">세트 완료</div>
  </div>
</div>
