<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap');

  .app * { box-sizing: border-box; margin: 0; padding: 0; }
  .app {
    width: 390px; height: 844px;
    background: #ffffff; color: #111111;
    font-family: 'Helvetica Neue', Helvetica, Arial, 'Malgun Gothic', sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .disp {
    font-family: 'Jost', 'Century Gothic', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600; letter-spacing: -0.01em;
  }

  .head {
    flex: none; height: 56px; padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid #e5e5e5;
  }
  .back { font-size: 20px; line-height: 1; }
  .head .t { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  .body { flex: 1; padding: 26px 20px 0; overflow: hidden; }

  .h1 { font-size: 30px; line-height: 1.06; letter-spacing: -0.02em; }
  .h2 { margin-top: 9px; font-size: 12px; color: #707072; letter-spacing: 0.02em; }

  .list { margin-top: 26px; }

  .row { padding: 14px 0; border-top: 1px solid #e5e5e5; }
  .row:first-child { border-top: none; padding-top: 0; }

  .rtop {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
  }
  .rtop .nm { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .rtop .ct {
    margin-left: auto; font-size: 15px;
    font-variant-numeric: tabular-nums; color: #707072;
  }
  .rtop .ct b { color: #111111; font-weight: 600; font-size: 17px; }
  .rtop .st {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 9999px; background: #f5f5f5; color: #707072;
  }
  .rtop .st.low { background: #111111; color: #ffffff; }
  .rtop .st.high { background: #ffffff; color: #d30005; box-shadow: inset 0 0 0 1px #d30005; }

  .track {
    position: relative; height: 22px; border-radius: 9999px; background: #f5f5f5;
  }
  .zone {
    position: absolute; top: 0; bottom: 0;
    background: #111111; border-radius: 9999px;
  }
  .mk {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 9999px;
    background: #ffffff; box-shadow: inset 0 0 0 3px #111111;
  }

  .scale {
    position: relative; height: 14px; margin-top: 6px;
    font-size: 10px; color: #cacacb; letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }
  .scale span { position: absolute; transform: translateX(-50%); }

  .note {
    margin: 0 20px; padding: 16px 0 0;
    border-top: 1px solid #e5e5e5;
    font-size: 11px; line-height: 1.6; color: #9e9ea0;
  }

  .foot {
    flex: none; padding: 16px 20px 26px;
  }
</style>
